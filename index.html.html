<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter your Details </title>
    <style>
        .body {

            background-color: #52e45e;

            height: 100vh;
        }
        .container {
            width: 380px;

            padding: 35px;

            box-shadow: 0px 0px 44px #fc0202;
            color: #040f09;

            left: 0px;
            top: 0px;
        }
        .h1 {
            text-align: center;
            color: #0a8a4e;
            border: 3px solid #4910e6;
            border-radius: 10px;
            background-color: #8eaee7;
            transform: translateY(-25px);
           
        }
        .mohit {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
           
        }
        .button {
            display: relative;
            width: 100px;
            height: 35px;
            padding: 10px;
            background-color: #9c6ee6;
            color: rgb(248, 10, 10);
            border: 1px solid #101a15;
            border-radius: 200px; 
            position: relative;
            left: 130px;
            box-shadow: 1px 3px 16px #1c6e2e;
        }
        .app{
            text-align: center;
            border: 1px solid black;
            height: 20px;
            width: 60px;
            position: relative;
            left: 150px;
            background-color: #0a8a4e;
            color: #18e273;
            top: -4px;
        }
        .acc{
            background-color: #fa0e68;
            color: #35fa0e;
            text-decoration: none;
            position: relative;
            left: 145px;
            top: 4px;
            
        }
        
        
    </style>
</head>
<body class="body">

            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <br><br>
            <br><br>
            <div class="app">
            <a href="https://www.Youtube.com/@mohitmahawar3288">Submit </a>
            </div>
            
            <a href="abc.html" class="acc">My profile</a>
            </div>
            
        </form>

</html>
